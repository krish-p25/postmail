services:
  app:
    image: postmail:latest
    container_name: postmail-app
    ports:
      - "${API_PORT:-3005}:3005"
    environment:
      NODE_ENV: production
      PORT: 3005
      DATABASE_URL: postgres://postgres:postgres@shared-postgres:5432/postgres
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3006/oauth/callback}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET}
      GMAIL_REDIRECT_URI: ${GMAIL_REDIRECT_URI:-http://localhost:3006/oauth/callback}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-http://localhost:3006/outlook/callback}
      OUTLOOK_MAILBOX_REDIRECT_URI: ${OUTLOOK_MAILBOX_REDIRECT_URI:-http://localhost:3006/outlook/callback}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:3006}
    networks:
      - shared-db

networks:
  shared-db:
    external: true
