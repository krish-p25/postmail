services:
  app:
    image: postmail:latest
    container_name: postmail-app
    # No published port: nginx-proxy-manager reaches this container over the
    # nginxpm_default network instead (see docs/security-review.md #5). Publishing
    # 3005 to the host made the app reachable directly at http://<server-ip>:3005,
    # bypassing Cloudflare and every rate limiter that trusts its IP headers.
    environment:
      NODE_ENV: production
      PORT: 3005
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@shared-postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3006/oauth/callback}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET}
      GMAIL_REDIRECT_URI: ${GMAIL_REDIRECT_URI:-http://localhost:3006/oauth/callback}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-http://localhost:3006/outlook/callback}
      OUTLOOK_MAILBOX_REDIRECT_URI: ${OUTLOOK_MAILBOX_REDIRECT_URI:-http://localhost:3006/outlook/callback}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:3006}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
    networks:
      - shared-db
      - nginxpm_default

networks:
  shared-db:
    external: true
  # nginx-proxy-manager's network — lets it reach the app as http://postmail-app:3005
  # over Docker's internal network, instead of via the published host port (see
  # docs/security-review.md #5). Defined in ~/OneDrive/Desktop/nginx pm.
  nginxpm_default:
    external: true
