<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" width="440" height="280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="440" height="280" fill="url(#bg)"/>

  <!-- Subtle pattern circles -->
  <circle cx="380" cy="40" r="120" fill="rgba(255,255,255,0.06)"/>
  <circle cx="60" cy="250" r="80" fill="rgba(255,255,255,0.04)"/>

  <!-- Icon -->
  <g transform="translate(170, 50)">
    <rect width="100" height="100" rx="22" fill="rgba(255,255,255,0.2)"/>
    <rect x="19" y="28" width="62" height="44" rx="6" stroke="#fff" stroke-width="5" fill="none"/>
    <path d="M22 31l28 22 28-22" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="76" cy="28" r="13" fill="#22c55e"/>
    <circle cx="76" cy="28" r="5" fill="#fff"/>
  </g>

  <!-- Title -->
  <text x="220" y="185" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" fill="#ffffff">PostMail</text>

  <!-- Subtitle -->
  <text x="220" y="215" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="rgba(255,255,255,0.85)">Know when your emails are opened</text>

  <!-- Badges -->
  <g transform="translate(120, 235)">
    <rect width="90" height="24" rx="12" fill="rgba(255,255,255,0.2)"/>
    <text x="45" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#fff">Gmail</text>
  </g>
  <g transform="translate(230, 235)">
    <rect width="90" height="24" rx="12" fill="rgba(255,255,255,0.2)"/>
    <text x="45" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#fff">Outlook</text>
  </g>
</svg>
